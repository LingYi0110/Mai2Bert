[project]
name = "mai2bert"
version = "0.1.0"
description = "Structured-event BERT pretraining and difficulty regression for maimai MA2 charts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "h5py>=3.11",
    "lightning>=2.5",
    "loguru>=0.7",
    "numpy>=2.0",
    "omegaconf>=2.3",
    "pydantic>=2.8",
    "tensorboard>=2.14",
    "torch>=2.4",
    "tqdm>=4.65",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-tqdm>=4.65",
    "vulture>=2.16",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
# Pull torch from the CUDA 13.2 wheel index. CUDA 13.2 wheels
# are forward-compatible with newer drivers via the minor-version
# compatibility guarantee of the CUDA runtime. Override
# to the CPU index with `--index-url https://download.pytorch.org/whl/cpu` if
# you need CPU-only training.

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
# "src" must end up first on sys.path (pytest prepends in order) so the
# root-level preprocessing.py script does not shadow the src/preprocessing
# package during test collection.
pythonpath = ["tests", "src", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
warn_unreachable = true
plugins = ["pydantic.mypy"]
